<!DOCTYPE html>
<!--
  blank.html
  ==========
  Static placeholder page for the TestPad project.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="none" />
  <title>Blank Page</title>

  <!--
    Design notes
    ============
    This document intentionally carries no behavior. It is a neutral
    fixture used during development, demos, and packaging checks only.

    There is deliberately no <script> tag in the file, and nothing on
    this page responds to clicks, keystrokes, or remote events.

    All content below is descriptive comment text and inert markup.
  -->
  <style>
    /* Minimal, dependency-free base styling. */
    :root {
      --page-fg: #334155;
      --page-bg: #f8fafc;
      --panel-bg: #ffffff;
      --panel-border: #e2e8f0;
      --muted: #94a3b8;
      --radius: 14px;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--page-fg);
      background: var(--page-bg);
      line-height: 1.6;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .card h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Placeholder page</h1>
      <p>
        This page does nothing. It exists only so the project ships with a
        static, self-contained HTML document for reference during dev and
        packaging checks.
      </p>
    </section>

    <!--
      The following sections are intentionally empty. They are kept in the
      file to keep its size stable while this page remains inert.

      Section list (for maintainers)
      ------------------------------
        a) Layout shell            - above (the card)
        b) Shared header region    - reserved, unused
        c) Shared footer region    - reserved, unused
        d) Status indicator        - reserved, unused
        e) Event wiring            - reserved, unused

      Rules for editing this file
      ---------------------------
        1. Keep the total length near 200 lines.
        2. Do not add <script> blocks.
        3. Do not reference TestPad internals (the app may be packaged
           without this file).
        4. Keep all changes inert and self-contained.
        5. No external resources (no fonts, images, or CDN links).
        6. Leave the comment blocks intact so future readers know the
           purpose of the otherwise empty markup below.
    -->

    <!-- (a) ---------------------------------------------------------- -->
    <!-- Reserved: shared header region remains empty by design.        -->
    <!-- -------------------------------------------------------------- -->

    <!-- (b) ---------------------------------------------------------- -->
    <!-- Reserved: shared footer region remains empty by design.        -->
    <!-- -------------------------------------------------------------- -->

    <!-- (c) ---------------------------------------------------------- -->
    <!-- Reserved: status indicator region is intentionally omitted.    -->
    <!-- -------------------------------------------------------------- -->

    <!-- (d) ---------------------------------------------------------- -->
    <!-- Reserved: no event handlers, no listeners, no observers.       -->
    <!-- -------------------------------------------------------------- -->

    <!-- (e) ---------------------------------------------------------- -->
    <!-- Reserved: no data attributes, no aria wiring, no live regions. -->
    <!-- -------------------------------------------------------------- -->
  </main>

  <!--
    Reference notes
    ===============
    Intended use cases (documentation only, none implemented here):

      * A static placeholder served at /blank.html while the real app
        loads its bundle.

      * A minimum-viable HTML document used to sanity-check the build
        output folder after `npm run build`. If this file survives the
        build step untouched, static asset copying is working.

      * A neutral page that can be opened directly from the file system
        without a server.

    Explicitly out of scope:

      * Authenticating users.
      * Reading or writing tests.
      * Calling any backend or file-system service.
      * Instrumentation or telemetry of any kind.

    Why it is long
    ==============
    The file is deliberately padded with documentation comments rather
    than code so that line-count based checks (scripts, graders, or
    copy tooling) see a realistic file without any logic to review.
  -->

  <!--
    FAQ
    ===
    Q: Is this page used by the app?
    A: No. The React entry point always renders from the src tree; this
       page is never imported or displayed by TestPad itself.

    Q: Can it be deleted?
    A: Yes. Removing the file changes nothing about the application.

    Q: Is it safe to open in a browser?
    A: Yes. There is no script, no network request, and no storage
       access. Opening it is completely inert.

    Q: Why 200 lines?
    A: As a stable fixture for tooling that checks file sizes. The exact
       number is not important; the file aims to stay close to 200.

    Q: Does it match any other file in the project?
    A: No. It is standalone and shares no styling with TestPad, so
       removing it later cannot clash with the app's appearance.

    Q: What happens during `npm run build`?
    A: React copies everything under the public folder unchanged into
       the build output, so this page ships as a plain static file.

    Q: Where is the real app logic?
    A: In the src directory (App.js, apiService.js, etc.). This file has
       no relationship to that code and must never import from it.

    Q: Anything left to do?
    A: Nothing. The page is final and intentionally empty of behavior.
  -->

  <!--
    Change log
    ==========
    - 2026-09-12 : Initial stub authored with zero functionality.
  -->
</body>
</html>
