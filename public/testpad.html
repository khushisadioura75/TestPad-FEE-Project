<!DOCTYPE html>
<!--
  testpad.html
  ============
  Static demo of the TestPad UI. This page reuses the design tokens and
  component styling from src/App.css and mirrors the core flow of
  src/App.js (generate -> answer MCQs -> track progress -> submit ->
  new test), but implemented in plain vanilla JS so it runs with no
  server, no auth, and no external dependencies.

  How it connects to the app:
    - <style> below copies the :root variables and key component rules
      from src/App.css so the page looks like the real app.
    - The JS logic mirrors src/App.js: topic + counts -> generate ->
      MCQ answering with selection circles -> progress bar -> submit
      score -> "New Test" returns to the landing screen.

  What it deliberately does NOT do:
    - No Gemini question generation (no API key in a static file).
      Local sample questions are generated instead.
    - No code execution (Piston) and no file system access.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="none" />
  <title>TestPad — Static Demo</title>
  <style>
    /* ---------- Design tokens copied from src/App.css ---------- */
    * { box-sizing: border-box; }

    :root {
      --bg: #000000;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-2: rgba(255, 255, 255, 0.02);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #e8edf7;
      --text-2: #9aa7bd;
      --text-3: #6b7a90;
      --blue: #38bdf8;
      --blue-2: #2563eb;
      --amber: #f59e0b;
      --amber-2: #fbbf24;
      --green: #34d399;
      --red: #f87171;
      --purple: #a78bfa;
      --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
      --shadow-2: 0 24px 60px -24px rgba(0, 0, 0, 0.7);
      --ring: 0 0 0 3px rgba(56, 189, 248, 0.28);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .app-shell { min-height: 100vh; display: flex; flex-direction: column; background-color: var(--bg); }

    /* ---------- Top bar (from App.css) ---------- */
    .app-header {
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .app-brand {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.02em;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      user-select: none;
      cursor: pointer;
    }

    .app-brand::before {
      content: '';
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 12px var(--blue);
    }

    .brand-note {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-3);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* ---------- Landing / generator (from App.css) ---------- */
    .landing {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 64px 24px;
    }

    .landing-inner { width: 100%; max-width: 520px; }

    .tagline { font-size: 14px; color: var(--text-2); text-align: center; margin: 0 0 20px; }

    .panel {
      width: 100%;
      background: #15171d;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 32px 36px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    .field-label { font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-2); }

    .topic-input {
      width: 100%;
      background: #000;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      font-family: var(--sans);
      text-align: center;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .topic-input:focus { border-color: var(--blue); box-shadow: var(--ring); }

    .inline-hint { font-size: 12px; color: var(--text-3); margin: -6px 0 2px; }

    .count-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .count-row label { display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: var(--text-2); font-weight: 600; }

    .count-row input {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 12px;
      color: #fff;
      font-size: 13px;
      font-family: var(--mono);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .count-row input:focus { border-color: var(--blue); }

    .primary-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      color: #111;
      font-weight: 700;
      font-size: 13.5px;
      padding: 12px 18px;
      border-radius: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--sans);
      transition: transform 0.12s ease, filter 0.15s ease;
      box-shadow: 0 6px 18px -6px rgba(245, 158, 11, 0.55);
    }

    .primary-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }

    .demo-badge {
      position: absolute;
      top: -9px;
      right: 14px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-2);
      background: #15171d;
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 999px;
    }

    /* ---------- Test shell (sidebar + stage) ---------- */
    .test-shell { flex: 1; display: flex; min-height: 0; }

    .sidebar {
      width: 168px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.6);
      border-right: 1px solid var(--border);
      padding: 16px 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }

    .sidebar-title { font-size: 12px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .new-test-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 10px;
      font-weight: 700;
      padding: 4px 0;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--sans);
      transition: all 0.15s ease;
    }

    .new-test-btn:hover { color: var(--green); border-color: rgba(52, 211, 153, 0.4); background: rgba(52, 211, 153, 0.08); }

    .progress-bar { height: 3px; background: rgba(255, 255, 255, 0.06); border-radius: 999px; overflow: hidden; margin: 2px 0 6px; }

    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--green)); width: 0%; transition: width 0.2s ease; }

    .q-grid { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }

    .q-section-label { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-3); margin-top: 6px; }

    .q-btn {
      width: 100%;
      height: 32px;
      border-radius: 8px;
      border: 1px solid #fff;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      color: #06232e;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      font-family: var(--sans);
      transition: filter 0.12s ease, transform 0.12s ease;
    }

    .q-btn:hover { filter: brightness(1.1); }
    .q-btn.active { outline: 2px solid var(--amber); outline-offset: 1px; }
    .q-btn.answered { background: linear-gradient(135deg, #34d399, #10b981); }

    .question-stage { flex: 1; padding: 40px 32px; min-width: 0; }

    .stage-inner { max-width: 860px; width: 100%; margin: 0 auto; }

    .section-label { font-size: 10.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); margin-bottom: 12px; }

    .stage-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }

    .stage-tag {
      font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      padding: 4px 9px; border-radius: 6px; background: #362507; color: #f59e0b;
      border: 1px solid #78350f; font-family: var(--mono);
    }

    .stage-question { font-size: 21px; font-weight: 700; color: #fff; line-height: 1.4; margin: 0 0 16px; letter-spacing: -0.015em; }

    .stage-desc { font-size: 14px; color: var(--text-2); line-height: 1.6; margin: -6px 0 20px; }

    .mcq-layout { display: flex; gap: 24px; align-items: flex-start; min-width: 0; width: 100%; flex-wrap: wrap; }

    .mcq-prompt { flex: 1 1 0%; min-width: 240px; display: flex; flex-direction: column; }

    .mcq-pick-box {
      width: 290px; flex-shrink: 0; display: flex; flex-direction: column; gap: 9px;
      padding: 14px; border: 1px solid var(--border); border-radius: 16px;
      background: rgba(0, 0, 0, 0.5); box-shadow: var(--shadow-1); min-width: 0;
    }

    .pick-option {
      display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 11px;
      border: 1px solid transparent; background: rgba(255, 255, 255, 0.03); color: var(--text);
      font-size: 13.5px; line-height: 1.45; text-align: left; cursor: pointer; font-family: var(--sans);
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .pick-option:hover { background: rgba(255, 255, 255, 0.06); border-color: var(--border-strong); }

    .pick-option.selected {
      background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.55);
      box-shadow: 0 0 16px -4px rgba(56, 189, 248, 0.35);
    }

    .pick-circle {
      width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--text-3);
      flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
    }

    .pick-option.selected .pick-circle { border-color: var(--blue); background: var(--blue); box-shadow: 0 0 8px var(--blue); }
    .pick-text { flex: 1; }

    .sample-box { margin-top: 18px; border: 1px solid var(--border); border-radius: 12px; background: rgba(255, 255, 255, 0.02); padding: 12px 14px; }

    .sample-box-head { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }

    .sample-box-row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: stretch; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }

    .sample-box-row pre {
      margin: 0; background: #000; border: 1px solid rgba(245, 158, 11, 0.15);
      border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 12px;
      line-height: 1.5; color: #fde68a; white-space: pre-wrap; word-break: break-word;
    }

    .sample-box-label { align-self: center; font-weight: 700; }

    /* ---------- Submission overlay ---------- */
    .submission-screen {
      position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(8px);
    }

    .submission-card {
      background: #15171d; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px;
      padding: 40px 48px; text-align: center; box-shadow: var(--shadow-2); min-width: 320px;
    }

    .submission-check {
      width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 50%;
      background: rgba(52, 211, 153, 0.14); border: 1px solid rgba(52, 211, 153, 0.5);
      color: var(--green); font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    }

    .submission-title { font-size: 16px; font-weight: 700; }
    .submission-score { font-size: 44px; font-weight: 800; margin-top: 8px; color: #fff; }
    .submission-total { font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
    .submission-sub { font-size: 11px; color: var(--text-3); margin-bottom: 20px; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <span class="app-brand" id="home-link">TestPad</span>
      <span class="brand-note">Static demo · vanilla JS</span>
    </header>

    <!-- Landing / generator -->
    <div class="landing" id="landing">
      <div class="landing-inner">
        <p class="tagline">
          Enter a topic, pick how many MCQs and coding questions, and try the
          TestPad take-screen flow with locally generated sample questions.
        </p>
        <div class="panel">
          <span class="demo-badge">Demo</span>
          <label class="field-label" for="topic">Topic</label>
          <input id="topic" class="topic-input" type="text" placeholder="e.g. Java arrays"
                 autocomplete="off" spellcheck="false" />
          <p class="inline-hint">No backend here — sample questions are generated locally.</p>

          <div class="count-row">
            <label>MCQs
              <input id="mcq-count" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="5" />
            </label>
            <label>Coding questions
              <input id="coding-count" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="2" />
            </label>
          </div>

          <button class="primary-btn" id="create-btn">Create Test</button>
        </div>
      </div>
    </div>

    <!-- Test take screen -->
    <div class="test-shell" id="test-shell" hidden>
      <aside class="sidebar">
        <div class="sidebar-title" id="side-topic"></div>
        <button class="new-test-btn" id="new-test-btn">New Test</button>
        <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
        <div class="q-grid" id="q-grid"></div>
      </aside>

      <main class="question-stage">
        <div class="stage-inner" id="stage"></div>
      </main>
    </div>

    <!-- Submission overlay -->
    <div class="submission-screen" id="submission" hidden>
      <div class="submission-card">
        <div class="submission-check">✓</div>
        <div class="submission-title">Test Submitted</div>
        <div class="submission-score" id="score-earned">0</div>
        <div class="submission-total">out of <span id="score-total">0</span> marks</div>
        <div class="submission-sub">1 mark per MCQ</div>
        <button class="primary-btn" id="again-btn">New Test</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var SAMPLE_OPTIONS = [
        'Option A — a correct-looking statement about the topic.',
        'Option B — another plausible statement about the topic.',
        'Option C — a close but incorrect statement.',
        'Option D — clearly wrong.'
      ];

      var SAMPLE_CODING = {
        title: 'Double each number',
        description: 'Read N integers from standard input and print each one doubled on its own line.',
        input: '3\n1 2 3',
        output: '2\n4\n6',
        starter: [
          'import java.util.*;',
          '',
          'public class Main {',
          '  public static void main(String[] args) {',
          '    Scanner sc = new Scanner(System.in);',
          '    int n = sc.nextInt();',
          '    for (int i = 0; i < n; i++) {',
          '      System.out.println(sc.nextInt() * 2);',
          '    }',
          '  }',
          '}'
        ].join('\n')
      };

      var state = { test: null, active: 0, answers: {} };

      var el = function (id) { return document.getElementById(id); };

      function generateTest(topic, mcqCount, codingCount) {
        var mcqs = [];
        for (var i = 0; i < mcqCount; i++) {
          mcqs.push({
            question: topic + ' — MCQ ' + (i + 1) + ': which statement about "' + topic + '" is correct?',
            code: '// sample snippet for "' + topic + '"\nint x = ' + (i + 1) + ';\nSystem.out.println(x);',
            options: SAMPLE_OPTIONS.slice(0)
          });
        }
        var coding = [];
        for (var j = 0; j < codingCount; j++) {
          coding.push({ title: SAMPLE_CODING.title, description: SAMPLE_CODING.description + ' (instance ' + (j + 1) + ')', sample: SAMPLE_CODING });
        }
        return { topic: topic, mcqs: mcqs, coding: coding };
      }

      function combined() {
        var list = [];
        (state.test.mcqs || []).forEach(function (q, i) { list.push({ type: 'mcq', idx: i, data: q }); });
        (state.test.coding || []).forEach(function (q, i) { list.push({ type: 'coding', idx: i, data: q }); });
        return list;
      }

      function answeredCount() {
        var n = 0;
        (state.test && state.test.mcqs ? state.test.mcqs : []).forEach(function (_, i) {
          if (state.answers[i] !== undefined) n++;
        });
        return n;
      }

      function renderSidebar() {
        var list = combined();
        el('side-topic').textContent = state.test.topic;
        el('progress-fill').style.width = (list.length ? (answeredCount() / list.length) * 100 : 0) + '%';

        var html = '';
        list.forEach(function (item, idx) {
          var isMcq = item.type === 'mcq';
          var isFirstMcq = idx === 0 && isMcq;
          var isFirstCoding = !isMcq && (idx === 0 || combined()[idx - 1].type === 'mcq');
          var answered = isMcq ? state.answers[item.idx] !== undefined : false;
          if (isFirstMcq) html += '<div class="q-section-label">MCQs</div>';
          if (isFirstCoding) html += '<div class="q-section-label">Coding</div>';
          html += '<button class="q-btn ' + (state.active === idx ? 'active' : '') + (answered ? ' answered' : '') +
                  '" data-go="' + idx + '">' + (idx + 1) + '</button>';
        });
        el('q-grid').innerHTML = html;
      }

      function renderStage() {
        var list = combined();
        var item = list[state.active];
        var main = el('stage');
        if (!item) return;

        if (item.type === 'mcq') {
          var q = item.data;
          var opts = q.options.map(function (opt, oi) {
            var sel = state.answers[item.idx] === opt;
            return '<button class="pick-option' + (sel ? ' selected' : '') + '" data-pick="' + item.idx + '|' + oi + '">' +
              '<span class="pick-circle"></span><span class="pick-text">' + esc(opt) + '</span></button>';
          }).join('');

          main.innerHTML =
            '<div class="section-label">Multiple Choice</div>' +
            '<div class="stage-header"><span class="stage-tag">MCQ ' + String(item.idx + 1).padStart(2, '0') + '</span></div>' +
            '<div class="mcq-layout">' +
              '<div class="mcq-prompt">' +
                '<h2 class="stage-question">' + esc(q.question) + '</h2>' +
                '<pre class="mcq-code" style="font-family:var(--mono);font-size:13px;color:#bae6fd;background:linear-gradient(160deg,rgba(3,6,12,.9),rgba(8,12,24,.95));border:1px solid rgba(56,189,248,.22);border-left:3px solid var(--blue);border-radius:12px;padding:16px 18px;overflow-x:auto;">' + esc(q.code) + '</pre>' +
              '</div>' +
              '<div class="mcq-pick-box">' + opts + '</div>' +
            '</div>';
        } else {
          var c = item.data;
          main.innerHTML =
            '<div class="section-label">Coding</div>' +
            '<div class="stage-header"><span class="stage-tag">Coding ' + String(item.idx + 1).padStart(2, '0') + '</span></div>' +
            '<h2 class="stage-question">' + esc(c.title) + '</h2>' +
            '<p class="stage-desc">' + esc(c.description) + '</p>' +
            '<div class="sample-box">' +
              '<div class="sample-box-head">Sample</div>' +
              '<div class="sample-box-row"><span class="sample-box-label">Input</span><pre>' + esc(c.sample.input) + '</pre></div>' +
              '<div class="sample-box-row"><span class="sample-box-label">Output</span><pre>' + esc(c.sample.output) + '</pre></div>' +
            '</div>' +
            '<pre class="mcq-code" style="margin-top:18px;font-family:var(--mono);font-size:13px;color:#bae6fd;background:linear-gradient(160deg,rgba(3,6,12,.9),rgba(8,12,24,.95));border:1px solid rgba(56,189,248,.22);border-left:3px solid var(--blue);border-radius:12px;padding:16px 18px;overflow-x:auto;">' + esc(c.sample.starter) + '</pre>';
        }

        var goBtns = main.querySelectorAll('[data-go]');
        goBtns.forEach(function (b) { b.addEventListener('click', function () { state.active = Number(b.getAttribute('data-go')); renderAll(); }); });

        var pickBtns = main.querySelectorAll('[data-pick]');
        pickBtns.forEach(function (b) {
          b.addEventListener('click', function () {
            var parts = b.getAttribute('data-pick').split('|');
            var qIdx = Number(parts[0]);
            var oIdx = Number(parts[1]);
            var opt = state.test.mcqs[qIdx].options[oIdx];
            if (state.answers[qIdx] === opt) { delete state.answers[qIdx]; }
            else { state.answers[qIdx] = opt; }
            renderAll();
          });
        });
      }

      function renderAll() {
        renderSidebar();
        renderStage();
      }

      function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function startTest() {
        var topic = el('topic').value.trim();
        if (!topic) { alert('Please enter a topic.'); return; }
        var mcq = clamp(toNum(el('mcq-count').value), 0, 50);
        var cq = clamp(toNum(el('coding-count').value), 0, 20);
        state.test = generateTest(topic, mcq, cq);
        state.active = 0;
        state.answers = {};
        el('landing').hidden = true;
        el('test-shell').hidden = false;
        el('submission').hidden = true;
        renderAll();
      }

      function exitToLanding() {
        state.test = null;
        state.active = 0;
        state.answers = {};
        el('test-shell').hidden = true;
        el('submission').hidden = true;
        el('landing').hidden = false;
        el('topic').focus();
        renderAll();
      }

      function submitTest() {
        var total = (state.test && state.test.mcqs ? state.test.mcqs.length : 0);
        var earned = Object.keys(state.answers).length;
        el('score-earned').textContent = earned;
        el('score-total').textContent = total;
        el('submission').hidden = false;
      }

      function toNum(v) {
        var n = parseInt(String(v).replace(/[^0-9]/g, ''), 10);
        return isNaN(n) ? 0 : n;
      }
      function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

      // Wire up controls.
      el('create-btn').addEventListener('click', startTest);
      el('new-test-btn').addEventListener('click', exitToLanding);
      el('again-btn').addEventListener('click', exitToLanding);
      el('home-link').addEventListener('click', exitToLanding);

      el('topic').addEventListener('keydown', function (e) { if (e.key === 'Enter') startTest(); });

      // Keep count inputs to two digits only, and select-all on focus so
      // typing a value replaces the default instead of appending to it.
      ['mcq-count', 'coding-count'].forEach(function (id) {
        var input = el(id);
        input.addEventListener('input', function () { input.value = input.value.replace(/[^0-9]/g, '').slice(0, 2); });
        input.addEventListener('focus', function (e) { input.select(); });
        input.addEventListener('mouseup', function (e) { e.preventDefault(); });
      });

      el('topic').focus();
    })();
  </script>
</body>
</html>
